name: Preparation tools
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: cmake -S native/kernel_smoke -B build/kernel-smoke
      - run: cmake --build build/kernel-smoke --config Release
      - run: ctest --test-dir build/kernel-smoke -C Release --output-on-failure
      - run: python scripts/check_public_tree.py
      - run: git diff --check
